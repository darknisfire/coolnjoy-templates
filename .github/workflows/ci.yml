name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 버전 증가 검사가 base 커밋의 templates/site.json 을 읽는다
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - run: gradle -p validator test --console=plain
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: templateVersion bump (pull request)
        if: github.event_name == 'pull_request'
        run: node scripts/check-version-bump.mjs --base "origin/${{ github.base_ref }}"
      - name: templateVersion bump (push)
        if: github.event_name == 'push'
        run: node scripts/check-version-bump.mjs --base "${{ github.event.before }}" --allow-missing-base
      - run: node scripts/build-dist.mjs

  deploy:
    needs: validate
    # main 브랜치 push 이고 repo variable DEPLOY_ENABLED=true 일 때만 배포한다.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: production
    # 배포끼리 직렬화하고, 실행 중인 배포를 취소하지 않는다.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: write # GitHub Release 생성(이 job 에만 부여)
    env:
      TEMPLATE_KEY_ID: ${{ vars.TEMPLATE_KEY_ID || 'k1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # 버전은 package.json 의 packageManager 를 따른다
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build dist
        run: node scripts/build-dist.mjs
      - name: Check secrets and variables
        env:
          TEMPLATE_SIGNING_KEY: ${{ secrets.TEMPLATE_SIGNING_KEY }}
          TEMPLATE_PUBLIC_KEY: ${{ vars.TEMPLATE_PUBLIC_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in TEMPLATE_SIGNING_KEY TEMPLATE_PUBLIC_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing $name (secret/variable not set)"; missing=1; fi
          done
          exit $missing
      - name: Sign manifest
        env:
          TEMPLATE_SIGNING_KEY: ${{ secrets.TEMPLATE_SIGNING_KEY }}
        run: node scripts/sign.mjs
      - name: Verify signed dist
        env:
          TEMPLATE_PUBLIC_KEY: ${{ vars.TEMPLATE_PUBLIC_KEY }}
        run: node scripts/verify-dist.mjs
      - name: Read template version
        id: ver
        run: echo "version=$(node -p "JSON.parse(require('fs').readFileSync('dist/v1/manifest.json','utf8')).templateVersion")" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            dist/v1/manifest.json dist/v1/manifest.json.sig "dist/v1/site-${VERSION}.json" \
            --title "Template v${VERSION}" \
            --notes "templateVersion ${VERSION} (commit ${GITHUB_SHA})" \
            --target "${GITHUB_SHA}"
      - name: Production smoke
        env:
          TEMPLATE_PUBLIC_KEY: ${{ vars.TEMPLATE_PUBLIC_KEY }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # manifest 는 엣지 캐시(max-age=300)가 남아 있을 수 있어 몇 번 재시도한다.
          for i in 1 2 3 4 5 6 7 8; do
            if node scripts/verify-dist.mjs --url https://coolnjoy-templates.bateaux.workers.dev/v1/ --expect-version "$VERSION"; then
              exit 0
            fi
            echo "attempt $i failed; retrying in 20s"
            sleep 20
          done
          echo "::error::Production smoke failed"
          exit 1
