name: Live smoke

on:
  schedule:
    - cron: '0 0 * * *' # 매일 00:00 UTC = 09:00 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Live smoke (4 boards)
        run: gradle -p validator liveTest --console=plain
      - name: Report failure as issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create site-change --description "사이트 마크업 변경 의심" --color d93f0b 2>/dev/null || true
          existing=$(gh issue list --label site-change --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "실사이트 smoke 가 다시 실패했습니다: ${RUN_URL}"
          else
            gh issue create --label site-change \
              --title "실사이트 smoke 실패: 템플릿 점검 필요" \
              --body "일일 live smoke 가 실패했습니다. 사이트 마크업이 바뀌었을 수 있습니다.

          실행: ${RUN_URL}

          확인 후 templates/site.json 을 수정하고 templateVersion 을 올리세요."
          fi
